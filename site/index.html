<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAA_OSINT — Curated OSINT Tools & Resources</title>
  <meta name="description" content="AAA_OSINT — A curated collection of 940+ OSINT tools and resources across 25 categories. Open source intelligence tools for researchers, investigators, and analysts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background effects -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="topbar__left">
      <button class="topbar__menu-btn" id="sidebar-toggle" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="topbar__brand">
        <span class="topbar__icon">🛰</span>
        <span class="topbar__title">AAA_<span class="topbar__accent">OSINT</span></span>
      </div>
    </div>
    <div class="topbar__search" id="search-box">
      <svg class="topbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" class="topbar__search-input" placeholder="Search tools, categories…" autocomplete="off">
      <kbd class="topbar__kbd" id="search-kbd">/</kbd>
      <button class="topbar__search-clear" id="search-clear" aria-label="Clear search" style="display:none;">✕</button>
    </div>
    <div class="topbar__stats">
      <span class="topbar__stat"><strong id="stat-tools">—</strong> tools</span>
      <span class="topbar__stat-sep">·</span>
      <span class="topbar__stat"><strong id="stat-categories">—</strong> categories</span>
    </div>
  </header>

  <!-- Layout wrapper -->
  <div class="layout" id="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <span class="sidebar__label">Categories</span>
        <button class="sidebar__collapse-btn" id="sidebar-collapse" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Category navigation">
        <!-- "All" item + category items injected by JS -->
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main" id="main">
      <div class="results-info" id="results-info" style="display:none;"></div>
      <div id="categories-container"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-state__icon">🔍</div>
        <h2>No results found</h2>
        <p>Try a different search term or browse categories.</p>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>
      <a href="https://github.com/kalidraco/AAA_OSINT" target="_blank" rel="noopener">AAA_OSINT</a> — Licensed under <a href="./LICENSE" target="_blank">CC0 1.0</a>
    </p>
    <p class="footer__note">⚠️ Most tools are third-party. Always vet and use responsibly.</p>
  </footer>

  <!-- Back to top -->
  <button class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>

  <script src="app.js"></script>
</body>
</html>
